<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <defs>
        <linearGradient id="cardGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#6366F1"/>
            <stop offset="100%" stop-color="#2563EB"/>
        </linearGradient>

        <linearGradient id="arrowGradient" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22C55E"/>
            <stop offset="100%" stop-color="#16A34A"/>
        </linearGradient>
    </defs>

    <!-- Back flashcard -->
    <g transform="rotate(-8 256 240)">
        <rect x="90" y="120" width="330" height="240" rx="30"
              fill="#DBEAFE"/>
    </g>

    <!-- Front flashcard -->
    <rect x="90" y="120" width="330" height="240" rx="30"
          fill="url(#cardGradient)"/>

    <!-- Three centered lines -->
    <rect x="135" y="165" width="240" height="20" rx="10"
          fill="#FFFFFF" opacity="0.95"/>

    <rect x="135" y="230" width="240" height="20" rx="10"
          fill="#FFFFFF" opacity="0.75"/>

    <rect x="135" y="295" width="240" height="20" rx="10"
          fill="#FFFFFF" opacity="0.55"/>

    <!-- Installation badge centered on the card -->
    <circle cx="255" cy="240" r="82" fill="#FFFFFF"/>
    <circle cx="255" cy="240" r="68" fill="url(#arrowGradient)"/>

    <!-- Download arrow -->
    <path d="M255 197v58"
          stroke="#FFFFFF"
          stroke-width="18"
          stroke-linecap="round"/>

    <path d="M225 237l30 30 30-30"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="18"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Install tray -->
    <path d="M219 281h72"
          stroke="#FFFFFF"
          stroke-width="14"
          stroke-linecap="round"/>
</svg>