InstallKarafOp.description.fullyInstalled=Im Verzeichnis %s wurde eine Karaf-Installation gefunden.\n\
\n\
Es kann entweder eine Neuinstallation durchgeführt oder die vorhandene Installation weiterverwendet werden (empfohlen).\n\
\n\
Achtung: Bei einer Neuinstallation werden alle vorhandenen Daten gelöscht.
InstallKarafOp.description.partiallyInstalled=Im Verzeichnis %s wurde eine unvollständige Karaf-Installation gefunden.\n\
Möglicherweise wurde die Installation einmal gestartet, aber nicht abgeschlossen.\n\
\n\
Es kann entweder eine Neuinstallation durchgeführt (empfohlen) oder die vorhandene unvollständige Installation weiterverwendet werden.\n\
\n\
Achtung: Bei einer Neuinstallation werden alle vorhandenen Daten im Verzeichnis gelöscht.
